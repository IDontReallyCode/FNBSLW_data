async function open(pw, quiet) {
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, key, b(P.data)));
    if (document.getElementById("keep")?.checked) { try { localStorage.setItem(KEY, pw); } catch (e) {} }
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem(KEY); } catch (x) {}
    if (!quiet) document.getElementById("err").textContent = "Wrong password.";
  }
}
