 10:00 AM – 1:00 PM","by_appointment":"Other times by appointment","notes":""},{"name":"Yankuo Qiao","office":"3514","email":"qiaoy@uww.edu","phone":"262-472-5460","in_person_text":"Tuesday & Thursday: 12:30 PM – 1:00 PM, 3:30 PM – 5:30 PM","virtual_text":"Wednesday: 10:00 AM – 1:00 PM","by_appointment":"Other times by appointment","notes":""},{"name":"Patrick M Roney","office":"1209*","email":"roneyp@uww.edu","phone":"262-472-5466","in_person_text":"Monday & Wednesday: 1:10 PM – 1:55 PM, 3:15 PM – 4:00 PM","virtual_text":"","by_appointment":"Other times by appointment","notes":""},{"name":"Md Showaib Rahman Sarker","office":"3520","email":"sarkerm@uww.edu","phone":"262-472-1029","in_person_text":"Monday: 12:15 PM – 2:00 PM & 3:15 PM – 4:00 PM  Wednesday: 12:15 PM – 2:00 PM & 3:15 PM – 4:00 PM","virtual_text":"Tuesday, 1:00–4:00 PM. Book through Canvas → Cisco Webex → Office Hours (preferably 24 hours in advance). Drop-ins welcome.","by_appointment":"Other times by appointment","notes":""},{"name":"Bakhtear Talukdar","office":"3515","email":"talukdam@uww.edu","phone":"262-472-7036","in_person_text":"","virtual_text":"","by_appointment":"","notes":""},{"name":"Gene Toboyek","office":"3517","email":"toboyekg@uww.edu","phone":"262-472-3950","in_person_text":"Tuesday & Thursday: 8:30 AM – 9:30 AM\nTuesday & Thursday: 12:15 PM – 1:45 PM","virtual_text":"Friday: 9:00 AM – 12:00 PM","by_appointment":"Other times by appointment","notes":""},{"name":"Yuan Yuan","office":"3513","email":"yuany@uww.edu","phone":"262-472-5458","in_person_text":"Monday & Wednesday: 12:15 PM – 2:45 PM","virtual_text":"Tuesday 9:00 AM – 12:00 PM","by_appointment":"Other times by appointment","notes":""},{"name":"Yanhui Zhao","office":"3523","email":"zhaoya@uww.edu","phone":"262-472-1299","in_person_text":"Tuesday & Thursday: 12:30 PM – 3:00 PM","virtual_text":"Friday: 10:00 AM – 1:00 PM","by_appointment":"Other times by appointment","notes":"Additional times available by appointment as a supplementary option."}],"exported":"Nov 05 2026 09:16 AM"};
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAYS_LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SOON = 60;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = m => { const h = Math.floor(m / 60), mi = m % 60;
  return `${(h + 11) % 12 + 1}:${String(mi).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
// slot = [name, kind, day(0=Mon), startMin, endMin, where, note]
const S = { name: 0, kind: 1, day: 2, start: 3, end: 4, where: 5, note: 6 };
const where = s => s[S.where] || (s[S.kind] === "Virtual" ? "online" : "");
const nameBtn = n => `<button class="name" data-person="${esc(n)}">${esc(n)}</button>`;
const kind = k => `<span class="k k-${esc(k).replace(" ", "-")}">${esc(k)}</span>`;

function when() {
  if (document.querySelector("input[name=mode]:checked").value === "now") {
    const d = new Date();
    return { day: (d.getDay() + 6) % 7, min: d.getHours() * 60 + d.getMinutes(), now: true, date: d };
  }
  const [h, m] = ($("time").value || "14:00").split(":").map(Number);
  return { day: +$("day").value, min: h * 60 + m, now: false };
}
const activeAt = (slots, w) => slots.filter(s => s[S.day] === w.day && s[S.start] <= w.min && w.min < s[S.end])
  .sort((a, b) => a[S.end] - b[S.end] || a[S.name].localeCompare(b[S.name]));
const startingWithin = (slots, w) => slots.filter(s => s[S.day] === w.day && w.min < s[S.start] && s[S.start] <= w.min + SOON)
  .sort((a, b) => a[S.start] - b[S.start] || a[S.name].localeCompare(b[S.name]));

function fill(id, rows, cols) {
  $(id).innerHTML = rows.length ? rows.join("") : `<tr><td class="empty" colspan="${cols}">Nobody</td></tr>`;
}

function refresh() {
  const w = when();
  const label = w.now
    ? w.date.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
    : `<small>Checking</small> ${DAYS_LONG[w.day]} ${fmt(w.min)}`;
  $("clock").innerHTML = label;
  const ohRow = (s, t) => `<tr><td>${nameBtn(s[S.name])}</td><td>${kind(s[S.kind])}</td><td>${esc(where(s))}</td><td class="t">${fmt(t)}</td><td class="hide-sm">${esc(s[S.note])}</td></tr>`;
  const inNow = activeAt(DATA.officeHours, w), soon = startingWithin(DATA.officeHours, w), cls = activeAt(DATA.classes, w);
  $("n-in").textContent = `(${inNow.length})`; $("n-soon").textContent = `(${soon.length})`; $("n-class").textContent = `(${cls.length})`;
  fill("t-in", inNow.map(s => ohRow(s, s[S.end])), 5);
  fill("t-soon", soon.map(s => ohRow(s, s[S.start])), 5);
  fill("t-class", cls.map(s => `<tr><td>${nameBtn(s[S.name])}</td><td>${esc(s[S.where])}</td><td class="t">${fmt(s[S.end])}</td><td class="hide-sm">${esc(s[S.note])}</td></tr>`), 4);
}

function buildStatic() {
  const rows = [];
  for (let d = 0; d < 5; d++) {
    rows.push(`<tr class="dayrow"><td colspan="5">${DAYS_LONG[d]}</td></tr>`);
    DATA.officeHours.filter(s => s[S.day] === d)
      .sort((a, b) => a[S.start] - b[S.start] || a[S.name].localeCompare(b[S.name]))
      .forEach(s => rows.push(`<tr><td class="t">${fmt(s[S.start])} – ${fmt(s[S.end])}</td><td>${nameBtn(s[S.name])}</td><td>${kind(s[S.kind])}</td><td>${esc(where(s))}</td><td class="hide-sm">${esc(s[S.note])}</td></tr>`));
  }
  $("t-week").innerHTML = rows.join("");
  renderPeople();
  const n = new Set(DATA.officeHours.map(s => s[S.name])).size;
  $("status").textContent = `${n} faculty with hours · ${DATA.officeHours.length} office-hour slots · data exported ${DATA.exported} · click a name for details`;
}

function renderPeople() {
  const q = $("q").value.trim().toLowerCase();
  const has = new Set(DATA.officeHours.map(s => s[S.name]));
  const last = n => n.split(" ").pop();
  const br = t => esc(t).replace(/\n/g, "<br>");
  $("t-people").innerHTML = DATA.people
    .filter(p => !q || p.name.toLowerCase().includes(q))
    .sort((a, b) => last(a.name).localeCompare(last(b.name)))
    .map(p => `<tr class="${has.has(p.name) ? "" : "none"}"><td>${nameBtn(p.name)}</td><td>${esc(p.office)}</td><td class="hide-sm">${p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ""}</td><td>${br(p.in_person_text)}</td><td>${br(p.virtual_text)}</td></tr>`)
    .join("");
}

function showPerson(name) {
  const p = DATA.people.find(x => x.name === name);
  if (!p) return;
  const mine = DATA.officeHours.filter(s => s[S.name] === name).sort((a, b) => a[S.day] - b[S.day] || a[S.start] - b[S.start]);
  const items = [
    ["Office", p.office], ["Phone", p.phone],
    ["Email", p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : "", true],
    ["In person", p.in_person_text || "–"], ["Virtual", p.virtual_text || "–"],
    ["Other", p.by_appointment], ["Notes", p.notes],
    ["Slots", mine.map(s => `${DAYS[s[S.day]]} ${fmt(s[S.start])}–${fmt(s[S.end])} ${s[S.kind]}`).join("\n") || "–"],
  ];
  $("dlg-name").textContent = name;
  $("dlg-body").innerHTML = items.filter(i => i[1]).map(([k, v, raw]) => `<dt>${k}</dt><dd>${raw ? v : esc(v)}</dd>`).join("");
  $("dlg").showModal();
}

// ---- wiring ----
$("day").innerHTML = DAYS.slice(0, 5).map((d, i) => `<option value="${i}">${d}</option>`).join("");
$("day").value = Math.min((new Date().getDay() + 6) % 7, 4);
const toCheck = () => { document.querySelector("input[name=mode][value=check]").checked = true; refresh(); };
$("day").addEventListener("change", toCheck);
$("time").addEventListener("change", toCheck);
document.querySelectorAll("input[name=mode]").forEach(r => r.addEventListener("change", refresh));
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === "tab-" + b.dataset.tab));
}));
$("q").addEventListener("input", renderPeople);
document.addEventListener("click", e => { const b = e.target.closest("[data-person]"); if (b) showPerson(b.dataset.person); });

if (!DATA) {
  document.querySelector(".wrap").innerHTML = '<h1>Office Hours Now</h1><p style="color:var(--warn)">No data baked in. Run <b>build_web_page.py</b> (or Export Office Hours.bat) to generate this page.</p>';
} else {
  buildStatic(); refresh();
  setInterval(() => { if (when().now) refresh(); }, 30000);
}
</script>
